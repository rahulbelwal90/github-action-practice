# Goal : the goal is to create docker image
name: CI

on: 
  push:
    branches: [master]

jobs:
  code-lint:
    runs-on: ubuntu-latest
    steps:
     # This step will automatically clone the code of current branch into runner
      - name: Checkout/Clone the code
        uses: actions/checkout@v7
      # This step will install the Linting tool
      - name: Install Linter
        run: pip install ruff
      # This step will run Linter
      - name: Check the file for linting
        run: ruff check .
        
  
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Docker Setup [Login to Docker Hub]
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/my-flask-app:latest
          
